# Agent manifest - read by desk/registry/fleet.py to decide what this can do.
# Same schema as the other fleet members.

name: openterminal_ui
kind: hybrid          # A quant/analytics LIBRARY we import from, and a
                      # full terminal application we do not run. Only the
                      # library half is in scope.
version: 0.1.0        # upstream publishes no version; this is ours
upstream:
  repo: https://github.com/Hitheshkaranth/OpenTerminalUI
  pinned_commit: 8c46cbc
  branch: main                 # no release tags published
  licence: MIT                 # no constraints on use or modification
  install_mode: none           # NOT installed. Imported by sys.path, and
                               # that is the whole point - see below.
  clone: shallow               # --depth 1; 105 MB, 47 MB of it .git

provides:
  - ROBUSTNESS          # PSR / DSR / min track record length. The reason
                        # this repo is in the fleet at all.
  - INDICATORS          # 13 the desk lacks
  - VALUATION           # multi-stage FCFF DCF, reverse DCF
  - FUNDAMENTAL_SCORES  # ratios, scoring
  - STRATEGY_TEMPLATES  # 6 declarative presets + Pine/MQL5 export
  - SCANNER             # detectors, indicators, ranking
  - EXECUTION_MODEL     # realistic fill modelling
  - SENTIMENT           # news sentiment scoring
  - SCREENS             # 3 declarative screens as YAML data (NOT 6)

# WHY NOTHING IS INSTALLED, and why that is not laziness.
#
# The desk's venv pins pandas==2.3.3, and every measurement in this project
# rests on that pin holding. This repository's own requirements pull FastAPI,
# SQLAlchemy, Redis and a web stack it needs to be an application and we do
# not need to borrow arithmetic. So the modules that matter are loaded from
# `upstream/` on sys.path with NOTHING installed.
#
# MEASURED 2026-10-02, and this is what makes the approach viable:
#   16 of 20 target modules import and run with no install at all
#    4 need a dependency the desk does not have:
#        adapters/yahoo        httpx     (not needed - our own urllib
#                                         intraday fetch already works)
#        model_lab/montecarlo  PyYAML
#        nlp/filing_parser     httpx
#        core/factor_analysis  SQLAlchemy - the heaviest, and the one whose
#                                           absence costs least
#
# Two of the four are wanted eventually (PyYAML for the screens, httpx for
# filings) and both are light. Neither is installed yet, because neither is
# needed for the next measurement and an unneeded install is an unneeded
# risk to the pin.

verified:
  - "core/riskfolio/clustering.py + hrp.py: ward linkage on a correlation
     distance. EXTRACTED as desk/risk/clusters.py with two fixes, both
     measured on real data rather than argued. (a) The distance matrix is NOT
     Euclidean here - 7 of 120 centred-Gram eigenvalues negative, most
     negative -1.161 - and ward merges at height 1.5570 where the maximum
     possible distance is 1.0, so a threshold cut on that tree is meaningless.
     Cophenetic correlation: average 0.6998, ward 0.4591, complete 0.3735,
     single 0.3479. average is used on that ranking, and note that SINGLE
     linkage - what Lopez de Prado's HRP specifies - is the worst fit here.
     (b) corr().fillna(0) calls an unmeasurable pair UNCORRELATED, the most
     favourable diversification assumption available; the filled matrix had a
     smallest eigenvalue of -4.689, so it was not a correlation matrix at all.
     This switched on D7, the correlated-exposure cap, which had never fired."
  - "backend/robustness/scorecard.py: PSR 0.9157 / DSR 0.0410 on a
     synthetic 1200-trade 1:2 book with num_trials=618. Runs standalone
     with only numpy."
  - "backend/services/indicators.py: adx() ran on 120 real RELIANCE.NS
     bars, returned adx/plus_di/minus_di. list_indicators() reports 13."
  - "backend/core/valuation.py: imports with the repo root on sys.path;
     DcfInputs takes base_fcf, stages, terminal_growth, net_debt,
     shares_outstanding."
  - "backend/strategy_export/presets.py: PRESETS holds 6 templates -
     sma_cross, ema_cross, rsi_reversion, macd_signal,
     bollinger_breakout, donchian_breakout."

  - "scanner_engine/detectors.py holds 6 pattern detectors and is the most
     directly useful thing left in the repo: breakout_n_day_high (with rvol
     and a breakout buffer), bb_squeeze_breakout, nr7_breakout,
     inside_bar_breakout, trend_retest, supertrend_flip_ema_stack - the last
     being the cousin of the catalogue's unbuilt supertrend_adx.
     NOTE IT GETS THE OFF-BY-ONE RIGHT where the Pine exporter and the
     preset spec did not: prev_high = df['High'].iloc[-(n+1):-1].max()
     excludes the current bar.
     Its _step(name, passed, value, expected) design matches this desk's own
     'declare what you checked' convention - a detector returns WHY it passed
     or failed, not just a boolean."

risks:
  - "agent/playbook.py + agent/debate/roles.py: THE PROMPTS ARE THE ASSET
     here, and they import as data the way PRESETS did - playbook.compose is
     two lines. Read 3 of the 22 files in agent/ so far (playbook, debate/roles,
     debate/orchestrator); THIS IS NOT A VERDICT ON THE SUBTREE. The
     orchestrators are not importable: they depend on backend.agent.events,
     .streaming, .orchestrator, backend.config.settings and
     backend.services.llm.model_router, and are async/streaming throughout."
  - "agent/playbook.py ACTION_DISCIPLINE is LOOSER than our Stage 3 and must
     not be adopted. It lets the agent propose paper orders, alerts and
     watchlist additions via propose_* tools. Our _SYSTEM says YOUR ONLY
     POWER IS TO REMOVE NAMES, which is the no-LLM-may-relax-a-risk-gate
     constraint written into the prompt itself. Ours stays."
  - "ADOPTED from playbook.EVIDENCE_DISCIPLINE, one clause: never fill a gap
     from memory. build_prompt already writes 'not available' for every
     absent datum rather than omitting it - but being TOLD a figure is
     missing is not the same as being told not to supply it. A model shown
     'P/E: not available' for a well-known name can produce a plausible one
     from training data, and the plan would then rest on an undated,
     unsourced, possibly years-stale number while reading as though it
     rested on the filing data shown. Stage 3 only runs with a configured
     provider, so no other test exercises the prompt text; pinned by
     test_the_system_prompt_forbids_filling_gaps_from_memory."
  - "agent/debate: the bull/bear split is the right shape for PlanTrade
     .dissenting, which exists and is empty on every record so far. The
     useful detail is BEAR_RESEARCHER's instruction to identify weak
     support WITHOUT conceding the central thesis - without that a
     two-sided prompt returns a both-sides mush that fills the field
     without informing it. Not built: a second LLM pass per name doubles
     Stage 3 cost and nothing has measured whether a dissent improves a
     decision. Worth testing once Stage 3 runs at all."
  - "agent/playbook.STRATEGY_RESEARCHER states this project's own method back
     at it: form a hypothesis, change exactly ONE variable per round,
     always compare to the prior baseline, require out-of-sample
     validation, and a high in-sample return with p>=0.05 is curve-fitting
     rather than an edge. Nothing to import - recorded because an upstream
     repo independently arriving at the same discipline is evidence the
     discipline is right, not local taste."
  - "This is an application, not a library. Module boundaries are not
     designed for external import: 4 of 20 targets need siblings or
     dependencies, and a future upstream commit could break any import
     without that being a bug on their side. smoke_test.py exists to catch
     exactly that."
  - "agents/*/upstream/ is gitignored, so none of this is on GitHub. The
     September OneDrive event took vibe_trading's src/factors/base.py the
     same way. The manifest and smoke test are the recovery instructions."
  - "No release tags, so the pin is a bare commit - same weakness as
     vibe_trading."
  - "NOT 19 strategy templates. An earlier count of 19 came from grepping
     '\"id\"', which matches once per preset AND once per indicator inside
     it. There are 6, and donchian_breakout and a Bollinger variant
     duplicate what the desk already has - so the real gain is 4."
  - "FOUR MODULES FABRICATE DATA AND ALL FOUR LOOK REAL FROM THE OUTSIDE.
     None was findable from its name, its route, or the README - only by
     reading the file. This is the single strongest argument for the
     read-before-import rule: 4 of the ~25 modules probed invent data.
     The fourth, services/stress_test_service.py, was found while reading
     agent/tools/risk_tools.py and is the ONLY one that labels itself -
     the tool returns quality='synthetic' with an explicit note. Its note
     still understates it: it says sensitivities are 'sector presets plus
     deterministic per-ticker jitter', and in fact equity_beta,
     rate_sensitivity, commodity_beta, fx_exposure and credit_sensitivity
     are all preset + jitter(sha256(ticker)[i]), while for an unknown
     ticker the SECTOR comes from _infer_sector_from_hash - so both halves
     of the beta are a function of how the name is spelled. A risk number
     derived from a ticker's spelling is worse than no risk number. All
     four are enforced by desk/tests/test_upstream_quarantine.py.

       core/historical_data_service.py is THE WORST AND THE QUIETEST.
         fetch_daily_ohlcv() calls _synthetic_ohlcv() when the real provider
         returns nothing - a seeded random walk starting at 100 +/- 20,
         returned as OHLCV bars with NO warning, NO flag and NO exception.
         fetch_intraday_ohlcv() does the same through a bare
         `except Exception: bars = []`. A backtest on a symbol whose fetch
         failed would run on invented prices and look entirely normal.
         The salvage map had marked this 'take'.

       tca/service.py is ENTIRELY FAKE. generate_tca_report() builds ten
         'trades' from an md5 hash of the window string and returns them as a
         transaction cost analysis - expected slippage, realised slippage,
         fees, all synthesised. There is no real TCA in this repository.
         The salvage map had marked this 'take' too.

       services/sector_rotation.py calls _generate_mock_rrg() and returns
         INVENTED rotation data when its download fails. The least bad of the
         three: it at least prints a warning.

     All three quarantined. NEVER import a data-fetching module from this
     repository without reading its failure path first."
  - "services/data_quality_monitor.py is US-SHAPED, not generic:
     _is_us_regular_or_extended_market_hours() and
     _trading_minutes_elapsed_today() hardcode US session boundaries. Pointed
     at NSE it would mis-assess staleness on every bar. Needs a rewrite, not
     an import."
  - "services/corp_actions_service.py needs SQLAlchemy (Session,
     CorpActionORM) and the desk already has its own corporate actions.
     services/candle_aggregator.py builds candles from a live tick stream,
     which this desk does not have. Neither is applicable."
  - "nlp/sentiment.py (the REAL one, 237 lines at upstream/nlp/ - the
     backend/ path is a 3-line re-export) is a lexicon scorer with negation
     and intensifier handling, pure Python, no torch. Genuinely decent, and
     BLOCKED ON DATA rather than taken: configs/research/news.json is a
     SINGLE fetch from 2026-09-18 holding 118 clusters with ZERO symbol
     tagging and no history. Testing whether sentiment predicts returns needs
     news history across the backtest window AND articles tagged to symbols.
     We have neither, so wiring a scorer whose predictive value cannot be
     measured would be an unvalidated signal in the funnel.
     THIRD THING BLOCKED ON DATA, NOT CODE: the DCF (no balance sheet), two
     of three screens (ROE, debt-to-market-cap), and this."
  - "core/formula_engine.py is the RIGHT pattern for user-defined formulas -
     an ast.NodeVisitor whitelist validator rather than eval(). Worth copying
     if the desk ever offers custom screens. Not needed now: our screens are
     declarative dicts in desk/research/screens.py, which needs no evaluator."

  - "core/riskfolio/covariance.py: NOT TAKEN, and the reason is a measurement
     rather than the missing sklearn. Ledoit-Wolf shrinkage toward the
     identity DESTROYS threshold-based clustering instead of denoising it -
     adjusted Rand index against the sample clustering falls to 0.14-0.20 at
     delta=0.3 and to 0.0 at delta=0.5, where all 266 names become singletons.
     Compensating the threshold algebraically makes it worse (ARI 0.005), not
     better: shrinking every off-diagonal toward zero compresses all distances
     into a narrow band near sqrt(0.5) where average linkage cannot separate
     anything. Shrinkage is built to make a covariance matrix safe to INVERT
     for optimisation, which is a different job. The noise it addresses is
     real here (249 observations against 266 names), and the right tool for it
     would be Marchenko-Pastur eigenvalue filtering - Lopez de Prado's own
     recommendation - which removes noise eigenvalues while leaving the
     structure ones alone. Not implemented; nothing currently needs it.
     SECONDARY: sklearn is absent and installing it would pull joblib, which
     is pinned at 1.5.3."
  - "core/riskfolio/risk_measures.py: NOT TAKEN. The modelling is the most
     careful in the repository - the downside-deviation comment correctly
     explains why it divides by all periods rather than only negative ones -
     but every failure path reports a clean bill of health. _empty_report()
     returns max_drawdown 0.0 and the final np.nan_to_num turns ANY failed
     metric into 0.0, so a broken computation reads as never having lost
     money; calmar divides by max(max_drawdown, 1e-9) and so returns about 1e9
     when there is no drawdown; and sharpe falls back to 0.0 on zero
     volatility, where a constant positive return stream actually has
     unbounded Sharpe - the fallback points the wrong way. desk/robustness
     (PSR/DSR/MinTRL) and desk/backtest/ruin.py (block-bootstrap drawdown)
     already cover what the desk measures, and both refuse rather than
     default. Worth revisiting for CVaR and the Ulcer index if a validated
     edge ever needs richer reporting."
  - "core/riskfolio/optimization.py, black_litterman.py, nco.py,
     risk_parity.py: NOT APPLICABLE, and not for quality reasons. They solve
     for continuous weights across a universe under a mean-risk objective.
     The desk takes one to three DISCRETE swing trades whose size is set by
     stop distance and risk_pct, with hard concentration caps - there is no
     weight vector to optimise. optimization.py also imports covariance.py,
     so it carries the sklearn dependency. Revisit only if the desk ever holds
     a continuously rebalanced book, which is not the plan."

not_in_scope:
  - "The web application: FastAPI backend, React frontend, Docker, OMS,
     alerting, background services. 204 frontend components and 126 route
     modules that we do not run."
  - "Cross-asset: ETF, mutual funds, bonds, commodities, forex, crypto,
     fixed income. Real, catalogued in the salvage map, off our path."
  - "Microstructure: volume profile, footprint, order book, tape. Needs
     tick data the desk does not have."
