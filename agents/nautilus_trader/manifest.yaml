# Agent manifest — read by platform/registry/ to decide what this agent can do.
# Schema mirrors the TradingAgent contract in platform/contracts/.

name: nautilus_trader
kind: engine          # NOT an opinion-producing agent. It executes and evaluates.
version: 1.231.0
upstream:
  repo: https://github.com/nautechsystems/nautilus_trader
  pinned_tag: v1.231.0
  pinned_commit: 27a8e54
  licence: LGPL-3.0        # NOTE: copyleft. See README.md — affects distribution.

# This agent does NOT emit AnalysisResult. It consumes signals and returns
# fills, positions and performance. Registered as a service, not an opinion.
provides:
  - BACKTEST          # event-driven, nanosecond-resolution simulation
  - EXECUTION         # live/paper order routing via adapters
  - PORTFOLIO_STATE   # positions, balances, margin, realized/unrealized PnL
  - RISK_ENGINE       # pre-trade checks, order rate limits, position limits
  - DATA_CATALOG      # Parquet catalog, bar aggregation, wranglers

horizons:
  - INTRADAY          # native tick/bar resolution — this is its strength
  - SWING
  - POSITION

asset_classes:
  - EQUITY
  - CRYPTO
  - FX
  - COMMODITY         # futures/options via adapters

# Deterministic. No LLM, no token cost. Cost is wall-clock only.
cost_per_call:
  tokens: 0
  wall_clock_note: "~4s for 10k bars, single strategy, on this machine"

runtime:
  python: "3.14.3"
  venv: .venv                        # isolated — do NOT share with other agents
  entrypoint: smoke_test.py          # health check
  cwd_constraint: "Must NOT run with upstream/ as cwd or on sys.path"

health_check:
  command: .venv/Scripts/python.exe smoke_test.py
  expect_exit: 0
  last_verified: 2026-09-07
  last_result: "PASS — 10,000 bars, 810 fills, 405 positions"
